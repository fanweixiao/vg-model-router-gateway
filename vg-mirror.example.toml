# vg-mirror configuration. Copy to ./vg-mirror.toml (or pass --config <path>).

# "none" (default): pass `model` through unchanged
# "model-router":   classify each turn and route to small / medium / frontier
mode = "model-router"

[model-router]
small    = "gpt-5.6-luna"
medium   = "gpt-5.6-terra"
frontier = "gpt-6-astra"

# Send earlier conversation (user/assistant text, tool calls, trimmed tool output)
# to the classifier along with the current request. false = current request only.
include_context = true
# Max characters sent to the classifier; the oldest context is dropped first.
max_state_chars = 24000
# cheap requests go to `small` when prefer_cheap_model.noul is above this, otherwise to `medium`
cheap_threshold = 0.75

classifier_url   = "https://api.typesafe.ai/v1/systemone"
classifier_model = "jev-latest"
# On timeout or any classifier error, the request goes to `frontier`.
timeout_ms = 5000

# Training-data log, one JSON line per request. "" disables it.
log_path = "vg-mirror-router.jsonl"
